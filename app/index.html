<style>
:root{--fond:#F6F1E7;--carte:#FFFDF8;--encre:#23262C;--doux:#6E6A62;--trait:#E3DACB;--shu:#C8432B;--shu-pale:#F6DED8;--ai:#25405F;--ai-pale:#E2E8F0;--matcha:#5C7838;--matcha-pale:#E5ECD9;--ambre:#A86A12;--ambre-pale:#F6E7CC;--r:14px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

header#top{position:sticky;top:0;z-index:5;background:rgba(246,241,231,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:calc(10px + var(--st)) 14px 10px;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:10px}

.s{font-size:13px;color:var(--doux);overflow-wrap:anywhere}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{-webkit-appearance:none;appearance:none;border:1px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}

.badge.tiktok{background:#111;color:#fff}.badge.facebook{background:#1877F2;color:#fff}.badge.instagram{background:#B02E7C;color:#fff}.badge.youtube{background:#D61F14;color:#fff}.badge.carte{background:var(--matcha-pale);color:var(--matcha)}.badge.note{background:var(--ambre-pale);color:var(--ambre)}
.st-a-faire{background:var(--shu-pale);color:var(--shu)}.st-inscrit{background:var(--ambre-pale);color:var(--ambre)}.st-reserve{background:var(--matcha-pale);color:var(--matcha)}.st-abandon{background:#EEE;color:#777}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--trait);color:inherit}

#toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translateX(-50%);background:var(--encre);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}

#maj{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--sb));z-index:30;background:var(--ai);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#maj[hidden]{display:none}
.overlay{position:fixed;inset:0;background:#fff;z-index:35;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(20px + var(--st)) 20px calc(20px + var(--sb));text-align:center;overflow:auto}
.ja{font-size:clamp(28px,8.5vw,54px);font-weight:700;line-height:1.35;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;overflow-wrap:anywhere}

.bar{height:8px;background:#EDE6D8;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ai)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}

.idee.zappee{opacity:.6}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.btns .btn{flex:1 1 auto}
.voir{font-size:14px;font-weight:700;color:var(--ai);margin-top:4px}
.btn.on-avoir{background:var(--ambre);border-color:var(--ambre);color:#fff}
.vig-grande{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;background:#EDE6D8}
.th .x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
.empty{text-align:center;color:var(--doux);padding:18px 8px}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.conv .eq{padding-bottom:12px;color:var(--doux)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:15px}
.hint{font-size:13px;color:var(--doux);margin-top:6px}
@media (min-width:900px){body{padding-bottom:90px}nav#nav{max-width:720px;margin:0 auto;border:1px solid var(--trait);border-radius:16px 16px 0 0}}

<body>
<header id="top"><button id="back" hidden aria-label="Retour">‹</button><div class="tw"><div id="eyebrow"></div><h1 id="title">Japon 2027</h1></div></header>
<main id="view"><div class="empty">Chargement…</div></main>
<nav id="nav"></nav>
<div id="maj" hidden><div style="flex:1">Nouvelle version disponible.</div><button class="btn small" data-act="maj">Mettre à jour</button></div>
<div id="toast" role="status"></div>
<script>
'use strict';
/* =====================================================================
   Japon 2027 — appli de préparation et de voyage (PWA, données locales).
   Règles : voir CLAUDE.md du dépôt. Aucune donnée personnelle dans ce fichier.
   ===================================================================== */
const APP_VERSION = '2026.11.13-4';
const DB_NAME = 'japon-2027', DB_VERSION = 1;
const STORES = ['idees', 'etapes', 'jours', 'rappels', 'billets', 'depenses', 'meta', 'sauvegardes'];
const DATA_STORES = ['idees', 'etapes', 'jours', 'rappels', 'billets', 'depenses'];
const SHARED_SETTINGS = ['debut', 'fin', 'voyageurs', 'taux', 'tauxDate', 'budgetPrevu', 'updatedAt'];
const LOCAL_KEY = 'japon-2027-local';
const EXCHANGE_FORMAT = 'japon-2027-echange';
const MAX_BACKUPS = 3;

const S = { idees: [], etapes: [], jours: [], rappels: [], billets: [], depenses: [] };
let SET = { id: 'settings' };   // réglages partagés entre téléphones
let LOC = {};                   // réglages de cet appareil (localStorage)
let db = null, RECU = null, PENDING = null, LAST_ROUTE = '';
const $ = s => document.querySelector(s);
const view = $('#view'), nav = $('#nav');

/* ---------- Outils ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
const cmpFr = (a, b) => String(a).localeCompare(String(b), 'fr');
const now = () => new Date().toISOString();
function uid(p) { const a = new Uint8Array(9); crypto.getRandomValues(a); return p + '-' + Array.from(a, b => (b % 36).toString(36)).join(''); }
function parseNum(s) { if (typeof s === 'number') return s; const n = Number(String(s == null ? '' : s).replace(/[\s\u00a0\u202f]/g, '').replace(',', '.')); return n; }
const fmtEur = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const fmtYen = n => Math.round(n).toLocaleString('fr-FR') + ' ¥';
const fmtNum = n => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const firstLine = s => String(s || '').split(/\n/)[0].trim();
function byId(store, id) { return S[store].find(x => x.id === id); }
function live(store) { return S[store].filter(x => !x.deleted); }
function saveLoc() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(LOC)); } catch (e) { /* stockage plein ou privé */ } }
let toastTimer = 0;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, err ? 3800 : 1700); }
function go(h) { if (location.hash === h) render(); else location.hash = h; }

/* ---------- Dates (chaînes AAAA-MM-JJ, heure locale) ---------- */
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayStr = () => ymd(new Date());
function parseYmd(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
const validYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
function tripDays() { if (!validYmd(SET.debut) || !validYmd(SET.fin) || SET.fin < SET.debut) return []; const out = []; let d = SET.debut, g = 0; while (d <= SET.fin && g++ < 120) { out.push(d); d = addDays(d, 1); } return out; }
function dayLabel(s, opt) { return parseYmd(s).toLocaleDateString('fr-FR', opt || { weekday: 'short', day: 'numeric', month: 'long' }); }
const JSEM = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
function jst(y, m, d, h, mi) { return new Date(Date.UTC(y, m - 1, d, h - 9, mi)); } // heure du Japon (UTC+9, sans heure d'été)
function addMonths(y, m, n) { const i = y * 12 + (m - 1) + n; return { y: Math.floor(i / 12), m: (i % 12) + 1 }; }
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
function fmtParis(d) { return d.toLocaleString('fr-FR', { timeZone: 'Europe/Paris', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

/* ---------- Mode préparation / voyage ---------- */
function isVoyage() {
  const m = LOC.mode || 'auto';
  if (m === 'voyage') return true;
  if (m === 'prep') return false;
  const t = todayStr();
  return !!(validYmd(SET.debut) && validYmd(SET.fin) && t >= addDays(SET.debut, -1) && t <= SET.fin);
}
function defaultEyebrow() {
  const t = todayStr();
  if (!validYmd(SET.debut)) return 'Préparation';
  if (t < SET.debut) { const n = diffDays(t, SET.debut); return n === 1 ? 'Départ demain' : 'Départ dans ' + n + ' jours'; }
  const days = tripDays();
  if (days.includes(t)) return 'Jour ' + (days.indexOf(t) + 1) + ' sur ' + days.length;
  return 'Voyage terminé';
}

/* ---------- Base de données (IndexedDB) ---------- */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => { const d = r.result; for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
    r.onsuccess = () => { const d = r.result; d.onversionchange = () => { d.close(); location.reload(); }; res(d); };
    r.onerror = () => rej(r.error);
    r.onblocked = () => toast('Fermez les autres fenêtres de l’appli', true);
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Écriture annulée')); });
const getAll = s => reqP(db.transaction(s, 'readonly').objectStore(s).getAll());
async function putMany(store, recs) { const t = db.transaction(store, 'readwrite'); const os = t.objectStore(store); for (const r of recs) os.put(r); await txDone(t); }
// File d'écriture : les enregistrements partent dans l'ordre, une erreur n'arrête pas les suivants.
let WQ = Promise.resolve();
function persist(store, recs) { const copies = recs.map(r => JSON.parse(JSON.stringify(r))); const p = WQ.then(() => putMany(store, copies)); WQ = p.catch(() => {}); return p; }
async function saveRec(store, rec) {
  const t = now(); rec.updatedAt = t; if (!rec.createdAt) rec.createdAt = t;
  const arr = S[store]; if (!arr.includes(rec)) { const i = arr.findIndex(x => x.id === rec.id); if (i >= 0) arr[i] = rec; else arr.push(rec); }
  try { await persist(store, [rec]); } catch (e) { toast('Enregistrement impossible : ' + (e && e.message || e), true); throw e; }
  return rec;
}
async function saveSettings() { SET.id = 'settings'; SET.updatedAt = now(); await persist('meta', [SET]); }
async function softDelete(store, id) { const r = byId(store, id); if (!r) return; r.deleted = true; await saveRec(store, r); }

/* ---------- Idées (liens TikTok, Facebook…) ---------- */
const SRC = { tiktok: 'TikTok', facebook: 'Facebook', instagram: 'Instagram', youtube: 'YouTube', carte: 'Carte', web: 'Site', note: 'Note' };
function srcOf(u) {
  let h = ''; try { h = new URL(u).hostname.toLowerCase(); } catch (e) { return 'web'; }
  if (/(^|\.)tiktok\.com$/.test(h)) return 'tiktok';
  if (/(^|\.)(facebook\.com|fb\.watch|fb\.com|fb\.me)$/.test(h)) return 'facebook';
  if (/(^|\.)instagram\.com$/.test(h) || h === 'instagr.am') return 'instagram';
  if (/(^|\.)(youtube\.com|youtu\.be)$/.test(h)) return 'youtube';
  if (h === 'maps.app.goo.gl' || h === 'goo.gl' || /(^|\.)google\.[a-z.]+$/.test(h) && /\/maps/.test(u)) return 'carte';
  return 'web';
}
const TRACKING = /^(utm_.*|mibextid|rdid|share_url|_r|_t|is_from_webapp|sender_device|igsh|igshid|si|fbclid|share_app_id|refer|web_id|sec_user_id|checksum|u_code|preview_pb|language|timestamp|user_id|share_link_id|share_item_id|tt_from|app|social_sharing|sharer_language)$/i;
function normUrl(u) {
  try {
    const x = new URL(String(u).trim()); x.hash = '';
    for (const k of [...x.searchParams.keys()]) if (TRACKING.test(k)) x.searchParams.delete(k);
    const host = x.host.toLowerCase().replace(/^(www|m|mobile)\./, '');
    const q = x.searchParams.toString();
    return 'https://' + host + x.pathname.replace(/\/+$/, '') + (q ? '?' + q : '');
  } catch (e) { return String(u).trim(); }
}
function extractUrls(text) {
  const out = [], re = /https?:\/\/[^\s<>"'«»]+/gi; let m;
  while ((m = re.exec(String(text || '')))) { let u = m[0]; while (/[.,;:!?)\]}»”’]$/.test(u)) u = u.slice(0, -1); out.push(u); }
  return out;
}
function shortUrl(u) { try { const x = new URL(u); const p = x.pathname.length > 32 ? x.pathname.slice(0, 30) + '…' : x.pathname; return x.host.replace(/^www\./, '') + (p === '/' ? '' : p); } catch (e) { return String(u || '').slice(0, 40); } }
function ideeTitre(i) { return i.titre || firstLine(i.note) || (i.url ? shortUrl(i.url) : 'Idée'); }
async function addIdeas(text, par, extra) {
  extra = extra || {};
  const urls = extractUrls(text);
  const seen = new Set(live('idees').filter(i => i.url).map(i => normUrl(i.url)));
  const recs = []; let doublons = 0; const t = now();
  const base = () => ({ titre: extra.titre || '', note: extra.note || '', ville: extra.ville || '', par: par || '', etoile: false, statut: 'a-trier', createdAt: t, updatedAt: t });
  for (const u of urls) { const n = normUrl(u); if (seen.has(n)) { doublons++; continue; } seen.add(n); recs.push(Object.assign({ id: uid('i'), url: u, source: srcOf(u) }, base())); }
  if (!urls.length && String(text || '').trim()) {
    const lines = String(text).trim().split(/\n+/);
    recs.push(Object.assign({ id: uid('i'), url: '', source: 'note' }, base(), { titre: lines[0].slice(0, 140), note: lines.slice(1).join('\n') }));
  }
  if (recs.length) { await persist('idees', recs); S.idees.push(...recs); }
  return { ajout: recs.length, doublons, recs };
}

/* ---------- Itinéraire ---------- */
const byOrdre = (a, b) => (a.ordre || 0) - (b.ordre || 0) || cmpFr(a.heure || '', b.heure || '') || cmpFr(a.createdAt || '', b.createdAt || '');

/* ---------- Agenda (.ics) ---------- */
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0; for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ch; bytes = b; } else { cur += ch; bytes += b; } } out.push(cur); return out.join('\r\n '); }
const icsUtc = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsDate = d => ymd(d).replace(/-/g, '');
function rappelIcs(r) {
  const o = rappelCalc(r); if (!o.start) return null;
  const m = MODELES[r.modele] || MODELES.libre; const lien = safeUrl(r.lien || m.lien);
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Japon 2027//FR', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:' + r.id + '@japon-2027', 'DTSTAMP:' + icsUtc(new Date())];
  if (o.allDay) { L.push('DTSTART;VALUE=DATE:' + icsDate(o.start)); const e = new Date(o.start); e.setDate(e.getDate() + 1); L.push('DTEND;VALUE=DATE:' + icsDate(e)); }
  else { L.push('DTSTART:' + icsUtc(o.start)); L.push('DTEND:' + icsUtc(new Date(o.start.getTime() + 30 * 6e4))); }
  L.push('SUMMARY:' + icsEsc('Japon : réserver ' + (r.titre || m.titre)));
  L.push('DESCRIPTION:' + icsEsc([m.regle, r.note, lien].filter(Boolean).join('\n\n')));
  if (lien) L.push('URL:' + lien);
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-P1D', 'DESCRIPTION:' + icsEsc('Demain : ' + (r.titre || m.titre)), 'END:VALARM');
  if (!o.allDay) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-PT30M', 'DESCRIPTION:' + icsEsc('Dans 30 min : ' + (r.titre || m.titre)), 'END:VALARM');
  L.push('END:VEVENT', 'END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

function vRappels() {

  rs.sort((a, b) => rang(a) - rang(b) || (a.o.start || 0) - (b.o.start || 0) || cmpFr(a.r.titre, b.r.titre));
  const present = new Set(rs.map(x => x.r.modele));
  const ajout = Object.entries(MODELES).filter(([k]) => k === 'libre' || k === 'hotel' || !present.has(k));
  return `<p class="muted">Ce qui se réserve longtemps à l’avance. Les dates sont calculées à partir du jour prévu de la visite (à défaut, du premier jour du voyage), en heure de Paris.</p>

${!rs.length ? '<div class="card"><div class="empty">Aucune réservation suivie pour l’instant.</div></div>' : ''}
<div class="card"><h2>Ajouter</h2><div class="row">${ajout.map(([k, m]) => `<button class="btn small" data-act="rappel-add" data-v="${k}">+ ${esc(m.court)}</button>`).join('')}</div><p class="hint">Règles relevées le 13 novembre 2026 : revérifiez-les sur le site officiel quelques semaines avant.</p></div>`;
}
function vRappel(id) {

<label class="f">Lien</label><input type="url" data-f="lien" value="${esc(r.lien || m.lien || '')}">

}

function vBillet(id) {

/* ----- Budget ----- */

  for (const d of deps) { const e = eurOf(d); if (e == null) { sansTaux++; continue; } tot += e; parCat[d.cat] = (parCat[d.cat] || 0) + e; if (d.qui) parQui[d.qui] = (parQui[d.qui] || 0) + e; }
  const max = Math.max(1, ...Object.values(parCat));

  const days = tripDays(); const dDef = todayStr();

<p class="hint">${taux ? `1 € = ${fmtNum(taux)} ¥${SET.tauxDate ? ' (taux du ' + esc(SET.tauxDate) + ')' : ''}` : 'Indiquez le taux pour convertir.'}</p>
<div class="row" style="margin-top:8px"><input id="tauxIn" inputmode="decimal" placeholder="1 € = … ¥" value="${taux ? esc(String(taux).replace('.', ',')) : ''}" style="flex:1;min-width:110px"><button class="btn" data-act="taux-set">OK</button><button class="btn" data-act="taux-maj">Taux du jour</button></div></div>
<div class="card"><h2>Nouvelle dépense</h2>
<div class="row" style="flex-wrap:nowrap"><input id="depMontant" inputmode="decimal" placeholder="Montant" style="flex:1"><div class="seg" style="margin:0;flex:none">${[['JPY', '¥'], ['EUR', '€']].map(([v, l]) => `<button class="${dev === v ? 'on' : ''}" data-act="pick" data-k="depDevise" data-v="${v}" style="padding:8px 14px">${l}</button>`).join('')}</div></div>
<div class="chips" style="margin-top:10px">${CATS.map(c => `<button class="chip ${cat === c[0] ? 'on' : ''}" data-act="pick" data-k="depCat" data-v="${c[0]}">${c[2]} ${c[1]}</button>`).join('')}</div>
${vs.length ? `<div class="chips"><span class="s">Payé par :</span>${vs.map(v => `<button class="chip ${LOC.depQui === v ? 'on' : ''}" data-act="pick" data-k="depQui" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>` : ''}
<div class="row" style="align-items:flex-start"><input id="depNote" placeholder="Note (facultatif)" style="flex:2;min-width:150px"><input id="depDate" type="date" value="${dDef}" style="flex:1;min-width:140px"></div>
<button class="btn prim full" style="margin-top:10px" data-act="dep-add">Ajouter la dépense</button></div>
<div class="card"><h2>Total</h2><div class="big">${fmtEur(tot)}</div>${taux ? `<div class="s">soit ${fmtYen(tot * taux)}${days.length ? ' · ' + fmtEur(tot / days.length) + ' par jour sur ' + days.length + ' jours' : ''}</div>` : ''}${sansTaux ? `<p class="hint">${sansTaux} dépense${sansTaux > 1 ? 's' : ''} en yens pas comptée${sansTaux > 1 ? 's' : ''} : indiquez le taux.</p>` : ''}
${SET.budgetPrevu ? `<div class="kv"><span>Budget prévu</span><b>${fmtEur(SET.budgetPrevu)}</b></div><div class="bar"><i style="width:${Math.min(100, tot / SET.budgetPrevu * 100).toFixed(1)}%;${tot > SET.budgetPrevu ? 'background:var(--shu)' : ''}"></i></div><div class="s">Reste ${fmtEur(SET.budgetPrevu - tot)}</div>` : ''}
${Object.keys(parCat).length ? '<hr style="border:0;border-top:1px solid var(--trait);margin:12px 0">' + CATS.filter(c => parCat[c[0]]).map(c => `<div class="kv"><span>${c[2]} ${c[1]}</span><b>${fmtEur(parCat[c[0]])}</b></div><div class="bar"><i style="width:${(parCat[c[0]] / max * 100).toFixed(1)}%"></i></div>`).join('') : ''}
${Object.keys(parQui).length > 1 ? '<hr style="border:0;border-top:1px solid var(--trait);margin:12px 0">' + Object.entries(parQui).map(([q, v]) => `<div class="kv"><span>Payé par ${esc(q)}</span><b>${fmtEur(v)}</b></div>`).join('') : ''}</div>
${[...groups].map(([k, l]) => `<div class="card"><h2>${k ? esc(dayLabel(k, { weekday: 'long', day: 'numeric', month: 'long' })) : 'Sans date'} <span class="s">· ${fmtEur(l.reduce((s, d) => s + (eurOf(d) || 0), 0))}</span></h2>${l.map(d => `<a class="item lien-plein" href="#/depense/${d.id}"><div style="font-size:20px;width:26px;text-align:center">${catLabel(d.cat)[2]}</div><div class="corps"><div class="t">${d.devise === 'EUR' ? fmtEur(d.montant) : fmtYen(d.montant)}${d.devise !== 'EUR' && eurOf(d) != null ? ` <span class="s">≈ ${fmtEur(eurOf(d))}</span>` : ''}</div><div class="s">${[catLabel(d.cat)[1], d.note, d.qui].filter(Boolean).map(esc).join(' · ')}</div></div></a>`).join('')}</div>`).join('')}`;
}

/* ----- Aujourd'hui (mode voyage) ----- */
function vAujourdhui() {
  const days = tripDays(), t = todayStr();
  if (!days.length) { H('Aujourd’hui'); return `<div class="card info"><h2>Dates du séjour</h2><p class="muted">Indiquez les dates pour voir la journée.</p><a class="btn prim" href="#/reglages">Régler les dates</a></div>`; }
  const d = days.includes(t) ? t : (t < days[0] ? days[0] : days[days.length - 1]); const k = days.indexOf(d);
  H('Jour ' + (k + 1) + ' sur ' + days.length, { eyebrow: dayLabel(d, { weekday: 'long', day: 'numeric', month: 'long' }) });
  const j = jourRec(d) || {}; const st = stepsOf(d); const bil = live('billets').filter(b => b.date === d);
  const dep = live('depenses').filter(x => x.date === d).reduce((s, x) => s + (eurOf(x) || 0), 0); const mu = mapDayUrl(st);
  const dem = days[k + 1]; const stDem = dem ? stepsOf(dem) : [];

${j.ville || j.nuit || j.note ? `<div class="card"><div class="t">${esc([j.ville, j.nuit ? 'nuit : ' + j.nuit : ''].filter(Boolean).join(' · '))}</div>${j.note ? `<div class="s">${esc(j.note)}</div>` : ''}</div>` : ''}
<div class="card"><h2>Programme</h2>${st.length ? st.map(e => `<div class="item">${vigOf(e) ? `<a href="#/etape/${e.id}"><img class="vig p" src="${esc(vigOf(e))}" alt=""></a>` : ''}<a class="corps lien-plein" href="#/etape/${e.id}"><div class="t">${e.heure ? `<span style="color:var(--shu)">${esc(e.heure)}</span> · ` : ''}${esc(e.titre || '(sans titre)')}</div><div class="s">${[e.ville, e.horaires, e.reservation ? '🎟 ' + e.reservation : ''].filter(Boolean).map(esc).join(' · ')}</div>${e.note ? `<div class="s" style="margin-top:2px">${esc(firstLine(e.note))}</div>` : ''}</a><div style="display:flex;flex-direction:column;gap:4px">${e.adresseJa || e.adresse ? `<a class="btn small" href="#/taxi/${e.id}" aria-label="Taxi">🚕</a>` : ''}<a class="btn small" href="${esc(mapUrl(e))}" target="_blank" rel="noopener" aria-label="Carte">🗺</a></div></div>`).join('') : '<div class="empty">Journée libre.</div>'}${mu ? `<a class="btn full" style="margin-top:8px" href="${esc(mu)}" target="_blank" rel="noopener">Carte du jour ↗</a>` : ''}</div>

${dem ? `<a class="card lien-plein" href="#/jour/${dem}"><div class="s">Demain · ${esc(dayLabel(dem))}</div><div class="t">${esc(stDem.map(e => e.titre).filter(Boolean).slice(0, 3).join(' · ') || 'Rien de prévu')}</div></a>` : ''}`;

const STORE_NOMS = { idees: 'idées', etapes: 'étapes', jours: 'journées', rappels: 'réservations', billets: 'billets', depenses: 'dépenses' };

  },
  async fichiers(el) {
    const b = byId('billets', el.dataset.id); const files = [...el.files]; el.value = ''; if (!b || !files.length) return;
    toast('Ajout en cours…'); let n = 0;
    for (const f of files) { try { (b.fichiers = b.fichiers || []).push(await lireFichier(f)); n++; } catch (e) { toast(e.message, true); } }
    if (n) { delete b.fichiersOmis; await saveRec('billets', b); render(); toast(n + ' pièce' + (n > 1 ? 's' : '') + ' ajoutée' + (n > 1 ? 's' : '')); }
  },
  async import(el) {
    const f = el.files[0]; el.value = ''; if (!f) return;
    try { if (f.size > 200e6) throw new Error('Fichier trop lourd.'); let p; try { p = JSON.parse(await f.text()); } catch (e) { throw new Error('Ce fichier n’est pas lisible.'); } validatePayload(p); PENDING = { p, mp: mergePlan(p) }; render(); }
    catch (e) { PENDING = null; render(); toast(e.message, true); }
  }
};
document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.matches('[data-f]')) {
      const box = el.closest('[data-rec]'); if (!box) return;
      const [store, id] = box.dataset.rec.split(':'); let rec = byId(store, id);
      if (!rec) { if (store === 'jours') rec = { id, date: box.dataset.date }; else return; }
      const f = el.dataset.f; let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.dataset.type === 'num') { v = parseNum(v); if (!isFinite(v)) { toast('Nombre invalide', true); render(); return; } }
      else if (typeof v === 'string') v = v.trim();
      rec[f] = v; if (HOOKS[store + '.' + f]) await HOOKS[store + '.' + f](rec);
      await saveRec(store, rec); toast('Enregistré');
      if (el.dataset.rerender) render(); else nav.innerHTML = navHTML(location.hash);
      return;
    }
    if (el.matches('[data-set]')) {
      const k = el.dataset.set; const v = el.value.trim();
      if (k === 'voyageur') { const vs = (SET.voyageurs || []).slice(); vs[Number(el.dataset.idx)] = v; SET.voyageurs = vs; }
      else if (k === 'budgetPrevu') { const n = parseNum(v); SET.budgetPrevu = v && isFinite(n) && n > 0 ? n : null; }
      else if (k === 'debut' && validYmd(SET.debut) && validYmd(v) && v !== SET.debut && (live('etapes').some(x => validYmd(x.jour)) || live('jours').length)) {
        // Les vols changent : on propose de décaler tout le voyage (journées, étapes, jours de visite), durée gardée.
        const old = SET.debut, n = diffDays(old, v);
        const ok = confirm('Décaler tout le voyage de ' + (n > 0 ? '+' : '') + n + ' jour' + (Math.abs(n) > 1 ? 's' : '') + ' ?\n\nLes journées, les étapes et les jours de visite suivent, le dernier jour aussi. Les billets et les dépenses ne bougent pas.\n\nAnnuler = changer seulement le premier jour.');
        SET.debut = v;
        if (ok) {
          try { await shiftTrip(n); } catch (err) { SET.debut = old; toast('Décalage impossible : ' + (err && err.message || err), true); render(); return; }
          toast('Voyage décalé de ' + (n > 0 ? '+' : '') + n + ' j'); render(); return;
        }
      }
      else SET[k] = v || null;
      await saveSettings(); toast('Enregistré'); $('#eyebrow').textContent = defaultEyebrow(); nav.innerHTML = navHTML(location.hash);
      return;
    }
    if (el.matches('[data-loc]')) { LOC[el.dataset.loc] = el.value.trim(); saveLoc(); toast('Enregistré'); return; }
    if (el.matches('[data-change]')) await CHG[el.dataset.change](el, e);
  } catch (err) { console.error(err); toast('Erreur : ' + (err && err.message || err), true); }
});
// Avant de quitter l'appli, on valide le champ en cours (iPhone : l'appli peut être fermée sans « blur »).
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && document.activeElement && document.activeElement.matches('input,textarea,select')) document.activeElement.blur(); });
window.addEventListener('hashchange', render);

/* =====================================================================
   Mises à jour (service worker) et démarrage
   ===================================================================== */
const SW = { reg: null, waiting: null };
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('service-worker.js').then(reg => {
    SW.reg = reg;
    const check = () => { if (reg.waiting && navigator.serviceWorker.controller) { SW.waiting = reg.waiting; $('#maj').hidden = false; } };
    check();
    reg.addEventListener('updatefound', () => { const nw = reg.installing; if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed') check(); }); });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && SW.reg) SW.reg.update().catch(() => {}); });
}
async function start() {
  try { LOC = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}') || {}; } catch (e) { LOC = {}; }
  try { db = await openDB(); await reloadAll(); }
  catch (e) { view.innerHTML = `<div class="card alerte"><h2>Stockage indisponible</h2><p class="muted">${esc(e && e.message || e)}. En navigation privée, l’appli ne peut rien garder.</p></div>`; return; }
  // Menu « Partager » d'Android : l'appli est ouverte avec ?lien=…&texte=…&titre=…
  const q = new URLSearchParams(location.search);
  if (q.has('lien') || q.has('texte') || q.has('titre')) { RECU = { titre: q.get('titre') || '', texte: q.get('texte') || '', lien: q.get('lien') || '' }; history.replaceState(null, '', location.pathname + '#/recu'); }
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { if (!p && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }).catch(() => {});
  render(); registerSW();
}
start();
